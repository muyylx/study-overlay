<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Overlay · Подключение панели</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1523;color:#e6edff;font-family:-apple-system,system-ui,sans-serif}.box{width:min(440px,calc(100% - 38px));padding:23px;border:1px solid #405475;background:#1a263c;border-radius:19px;box-sizing:border-box}h1{font-size:21px}p{line-height:1.6;color:#b6c5e0;font-size:14px}button,a{display:block;width:100%;box-sizing:border-box;text-align:center;padding:13px 16px;border:0;border-radius:11px;font:700 15px system-ui;cursor:pointer;margin-top:12px}button{background:#a7baff;color:#13223d}a{border:1px solid #566c92;color:#d5e1ff;text-decoration:none}#status{font-size:14px}</style></head><body><main class="box"><h1>🔐 Подключение Study Overlay</h1><p id="status">Проверяем вход на основном сайте…</p><button id="share" hidden>Подключить панель к моему аккаунту</button><a href="./index.html" id="openMain" hidden>Войти на основном сайте</a><p>Пароль и код приглашения повторно вводить не нужно. Данные передаются только между страницами Study Overlay.</p></main><script src="./config.js"></script><script>
(async()=>{
 const status=document.getElementById('status'),share=document.getElementById('share'),openMain=document.getElementById('openMain');
 const nonce=new URL(location.href).searchParams.get('nonce')||'';
 let token='',device='';try{token=localStorage.getItem('study_3_token')||'';device=localStorage.getItem('study_3_device')||'';}catch{status.textContent='Safari заблокировал хранение входа. Открой сайт Study Overlay в обычной вкладке Safari.';return;}
 if(!/^[a-f0-9]{32}$/.test(nonce)||!window.opener){status.textContent='Связь с панелью потеряна. Вернись в панель и снова нажми «Подключить аккаунт». Не открывай этот адрес напрямую.';return;}
 if(!/^[a-f0-9]{64}$/.test(token)||!/^[a-f0-9]{64}$/.test(device)){status.textContent='На основном сайте ещё нет действующего входа. Открой сайт, войди в аккаунт, затем повтори подключение в панели.';openMain.hidden=false;return;}
 const cfg=window.STUDY_CONFIG||{},api=String(cfg.apiBase||'').replace(/\/$/,'');
 try{const r=await fetch(api+'/me',{headers:{'authorization':'Bearer '+token,'x-study-device':device},cache:'no-store'});if(!r.ok)throw Error('Основной вход не подтверждён');const data=await r.json();status.textContent='Найден аккаунт «'+data.user.name+'». Можно подключить его к панели.';share.hidden=false;}
 catch(e){status.textContent='Не удалось подтвердить вход. Зайди в аккаунт на основном сайте и повтори подключение.';openMain.hidden=false;return;}
 share.addEventListener('click',()=>{
   try{window.opener.postMessage({type:'STUDY_PANEL_CONNECT',nonce,token,device},location.origin);status.textContent='Доступ отправлен в панель. Вернись к учебной вкладке, дождись подтверждения и закрой эту страницу.';share.hidden=true;}
   catch(e){status.textContent='Safari не передал вход. Вернись в панель и попробуй снова.';}
 });
})();
</script></body></html>
