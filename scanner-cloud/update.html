<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Scanner Access 3.119</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#111827;color:#f0f3ff;padding:24px 16px}main{max-width:680px;margin:0 auto}h1{font-size:32px;letter-spacing:-1px;margin:0 0 18px}textarea{display:block;width:100%;height:240px;resize:vertical;padding:14px;border-radius:12px;border:1px solid #46536b;background:#0b1220;color:#d9e3fa;font:12px/1.6 ui-monospace,monospace}button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:#8aabff;color:#101a30;font:600 16px system-ui;min-height:48px}button:disabled{opacity:.5}#status{font-size:13px;color:#bdc8df;min-height:18px}
</style></head><body><main><h1>3.119</h1><textarea id="code" readonly spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="JavaScript 3.119" placeholder="Загрузка кода…"></textarea><button id="copy" disabled>Скопировать JavaScript</button><p id="status" role="status" aria-live="polite"></p></main>
<script>
'use strict';
const field=document.getElementById('code'),copy=document.getElementById('copy'),status=document.getElementById('status');
const src='https://scanner-access-a43f105622.study-overlay-muyylx.workers.dev/public-bookmarklet';
async function load(){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);try{const r=await fetch(src,{cache:'no-store',mode:'cors',signal:ctrl.signal});if(!r.ok)throw Error('HTTP '+r.status);const value=(await r.text()).trim();if(!value.startsWith('javascript:')||value.length<1500||!value.includes('scanner-access-participant')||!value.includes('3.119')||value.includes('__SCANNER_OWNER_TOKEN__'))throw Error('Не получен JavaScript 3.119');field.value=value;copy.disabled=false;}catch(e){status.textContent='Не удалось загрузить код. Обнови страницу.';field.placeholder='Ошибка загрузки';}finally{clearTimeout(timer)}}
copy.onclick=async()=>{if(!field.value)return;try{await navigator.clipboard.writeText(field.value);copy.textContent='Скопировано';}catch(_){field.focus();field.select();try{field.setSelectionRange(0,field.value.length)}catch(_){}let ok=false;try{ok=document.execCommand('copy')}catch(_){}copy.textContent=ok?'Скопировано':'Код выделен — скопируй через меню Safari';}};load();
</script></body></html>
