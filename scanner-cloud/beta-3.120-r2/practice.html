<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="scanner-local-practice" content="3120-r2"><title>Scanner Access 3.120 R2</title><style>body{background:#f4f4f8;color:#24242c;font:16px/1.5 system-ui;max-width:640px;padding:16px;margin:30px auto}button,textarea{font:inherit}textarea{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:12px}button{background:#6657e9;color:white;border:0;padding:12px;border-radius:12px;margin:8px 0}small{color:#666}</style><h1>Scanner Access · 3.120 R2</h1><p>Самостоятельная практика. Введи своё задание, затем открой компактную панель.</p><label for="material">Текст для разбора</label><textarea id="material" rows="5">Explain when to use the present perfect and the past simple. Give two examples.</textarea><p><label for="photo">Изображение (необязательно)</label><br><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"></p><button id="launch">Открыть панель</button> <button id="owner">Панель владельца (диагностика)</button><p><small>При подключённом API материал отправляется выбранному провайдеру. Не добавляй личные данные. Не предназначено для текущих оценочных тестов.</small></p><script src="/panel.js"></script><script>document.querySelector('#launch').onclick=()=>window.scannerPractice(false);document.querySelector('#owner').onclick=()=>window.scannerPractice(true);</script></html>
